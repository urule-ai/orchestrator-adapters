name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build:all
      - name: Test
        run: npm run test:all

  docker-publish:
    # Pattern B — clones urule and orchestrator-contract alongside so the
    # langgraph-adapter Dockerfile (build context = parent of all three repos)
    # can resolve `file:../../urule/packages/*` and
    # `file:../../orchestrator-contract` workspace deps.
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-test]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout orchestrator-adapters
        uses: actions/checkout@v4
        with:
          path: orchestrator-adapters
      - name: Checkout urule
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/urule
          path: urule
      - name: Checkout orchestrator-contract
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/orchestrator-contract
          path: orchestrator-contract
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: urule/package-lock.json
      - name: Pre-build urule workspace packages
        run: npm --prefix urule install && npm --prefix urule run build:all
      - name: Pre-build orchestrator-contract
        run: npm --prefix orchestrator-contract install && npm --prefix orchestrator-contract run build
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/langgraph-adapter
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Build and push langgraph-adapter
        uses: docker/build-push-action@v6
        with:
          context: .
          file: orchestrator-adapters/langgraph-adapter/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=langgraph-adapter
          cache-to: type=gha,scope=langgraph-adapter,mode=max
